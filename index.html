const uid = () => Math.random().toString(36).slice(2, 10);

function hasClaudeStorage() {
  return typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
}

function hasLocalStorage() {
  try {
    const t = "__test__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return true;
  } catch (e) {
    return false;
  }
}

async function storageGet(key) {
  if (hasClaudeStorage()) {
    try {
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    } catch (e) {
      // sigue al respaldo local
    }
  }
  if (hasLocalStorage()) {
    return window.localStorage.getItem(key);
  }
  return null;
}

async function storageSet(key, value) {
  if (hasClaudeStorage()) {
    try {
      await window.storage.set(key, value, false);
      return true;
    } catch (e) {
      // sigue al respaldo local
    }
  }
  if (hasLocalStorage()) {
    try {
      window.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      return false;
    }
  }
  return false;
}

function ControlExamenes() {
  const [personal, setPersonal] = useState([]);
  const [registros, setRegistros] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [sinAlmacenPersistente, setSinAlmacenPersistente] = useState(false);

  const [nuevoNombre, setNuevoNombre] = useState("");
  const [filtroCiclo, setFiltroCiclo] = useState("Todos");

  const [form, setForm] = useState({
    fecha: "",
    hora: "",
    ciclo: "1er Ciclo",
    materiaId: "",
    tipo: "Evaluación formativa",
    apoyos: [],
  });

  const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
  const ROLES_DEFECTO = {
    "1er Ciclo": "Sr. Jefe de Estudios, Jefe de la SAC., Jefe de Evaluaciones, Evaluador de 1er. Ciclo",
    "2do Ciclo": "Evaluador de 2do. Ciclo",
  };

  const [rolesConfig, setRolesConfig] = useState(ROLES_DEFECTO);
  const [fechaMensaje, setFechaMensaje] = useState("");
  const [profesoresPorMateria, setProfesoresPorMateria] = useState({});
  const [mensaje, setMensaje] = useState("");

  const ACTIVIDADES = [
    "Reconocimiento de examen formativo",
    "Reconocimiento de evaluación sumativa",
    "Evaluación formativa",
    "Evaluación sumativa",
    "Feria de notas",
  ];

  function duracionPorTipo(tipo) {
    if (tipo === "Evaluación formativa") return 120;
    if (tipo === "Evaluación sumativa") return 300;
    return 0;
  }

  function getMateria(id) {
    return MATERIAS_ORDEN.find((m) => m.id === id) || null;
  }

  useEffect(() => {
    (async () => {
      if (!hasClaudeStorage() && !hasLocalStorage()) {
        setSinAlmacenPersistente(true);
      }
      const p = await storageGet(STORAGE_KEY_PERSONAL);
      const r = await storageGet(STORAGE_KEY_REGISTROS);
      if (p) {
        try {
          setPersonal(JSON.parse(p));
        } catch (e) {
          setPersonal(PERSONAL_INICIAL);
        }
      } else {
        setPersonal(PERSONAL_INICIAL);
        await storageSet(STORAGE_KEY_PERSONAL, JSON.stringify(PERSONAL_INICIAL));
      }
      if (r) {
        try {
          setRegistros(JSON.parse(r));
        } catch (e) {
          setRegistros([]);
        }
      }
      const mc = await storageGet(STORAGE_KEY_MENSAJE_CONFIG);
      if (mc) {
        try {
          setRolesConfig(JSON.parse(mc));
        } catch (e) {
          setRolesConfig(ROLES_DEFECTO);
        }
      }
      const pm = await storageGet(STORAGE_KEY_PROFESORES_MATERIA);
      if (pm) {
        try {
          setProfesoresPorMateria(JSON.parse(pm));
        } catch (e) {
          setProfesoresPorMateria({});
        }
      }
      setLoading(false);
    })();
  }, []);

  async function guardarPersonal(next) {
    setPersonal(next);
    const ok = await storageSet(STORAGE_KEY_PERSONAL, JSON.stringify(next));
    if (!ok && (hasClaudeStorage() || hasLocalStorage())) setError("No se pudo guardar la lista de personal.");
  }

  async function guardarRegistros(next) {
    setRegistros(next);
    const ok = await storageSet(STORAGE_KEY_REGISTROS, JSON.stringify(next));
    if (!ok && (hasClaudeStorage() || hasLocalStorage())) setError("No se pudo guardar el registro.");
  }

  async function guardarRolesConfig(next) {
    setRolesConfig(next);
    await storageSet(STORAGE_KEY_MENSAJE_CONFIG, JSON.stringify(next));
  }

  async function guardarProfesoresPorMateria(next) {
    setProfesoresPorMateria(next);
    await storageSet(STORAGE_KEY_PROFESORES_MATERIA, JSON.stringify(next));
  }

  function toggleProfesorMateria(materiaId, personaId) {
    if (!materiaId) return;
    const actuales = profesoresPorMateria[materiaId] || [];
    const yaEsta = actuales.includes(personaId);
    guardarProfesoresPorMateria({
      ...profesoresPorMateria,
      [materiaId]: yaEsta ? actuales.filter((id) => id !== personaId) : [...actuales, personaId],
    });
  }

  function agregarPersona() {
    const nombre = nuevoNombre.trim();
    if (!nombre) return;
    if (personal.some((p) => p.nombre.toLowerCase() === nombre.toLowerCase())) {
      setNuevoNombre("");
      return;
    }
    guardarPersonal([...personal, { id: uid(), nombre }]);
    setNuevoNombre("");
  }

  function quitarPersona(id) {
    guardarPersonal(personal.filter((p) => p.id !== id));
  }

  function toggleApoyo(id) {
    setForm((f) => {
      const yaEsta = f.apoyos.find((a) => a.personaId === id);
      return {
        ...f,
        apoyos: yaEsta ? f.apoyos.filter((a) => a.personaId !== id) : [...f.apoyos, { personaId: id, paralelo: "A" }],
      };
    });
  }

  function cambiarParaleloApoyo(id, paralelo) {
    setForm((f) => ({
      ...f,
      apoyos: f.apoyos.map((a) => (a.personaId === id ? { ...a, paralelo } : a)),
    }));
  }

  function onTipoChange(tipo) {
    setForm((f) => ({ ...f, tipo }));
  }

  function registrarExamen(e) {
    e.preventDefault();
    setError("");
    if (!form.fecha) {
      setError("Ingrese la fecha del examen.");
      return;
    }
    if (!form.hora) {
      setError("Ingrese la hora del examen.");
      return;
    }
    const materiaSel = getMateria(form.materiaId);
    if (!materiaSel) {
      setError("Seleccione la materia del examen.");
      return;
    }
    if (form.apoyos.length === 0) {
      setError("Seleccione al menos una persona de apoyo.");
      return;
    }

    const nuevo = {
      id: uid(),
      fecha: form.fecha,
      hora: form.hora,
      ciclo: form.ciclo,
      tipo: form.tipo,
      duracion: duracionPorTipo(form.tipo),
      mencionMateria: materiaSel.track + " — " + materiaSel.materia,
      profesoresMateria: (profesoresPorMateria[form.materiaId] || [])
        .map((id) => (personal.find((p) => p.id === id) || {}).nombre)
        .filter(Boolean),
      apoyos: form.apoyos,
    };
    guardarRegistros([nuevo, ...registros]);
    setForm({
      fecha: "",
      hora: form.hora,
      ciclo: form.ciclo,
      materiaId: "",
      tipo: form.tipo,
      apoyos: [],
    });
  }

  function eliminarRegistro(id) {
    guardarRegistros(registros.filter((r) => r.id !== id));
  }

  function generarPDF() {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(13);
      doc.text("ECEME \"Mcal. Andrés de Santa Cruz\"", 14, 15);
      doc.setFontSize(11);
      doc.text("Reporte de apoyo en el control de evaluaciones", 14, 22);
      doc.setFontSize(9);
      doc.text("Generado: " + new Date().toLocaleDateString("es-BO"), 14, 28);

      const filasRegistros = [];
      registros.forEach((r) => {
        r.apoyos.forEach((a) => {
          const persona = personal.find((p) => p.id === a.personaId);
          filasRegistros.push([
            r.fecha,
            r.ciclo,
            r.tipo,
            r.mencionMateria,
            "Paralelo " + a.paralelo,
            persona ? persona.nombre : "—",
          ]);
        });
      });

      doc.autoTable({
        startY: 34,
        head: [["Fecha", "Ciclo", "Tipo", "Materia", "Paralelo", "Docente asignado"]],
        body: filasRegistros,
        styles: { fontSize: 7, cellPadding: 2 },
        headStyles: { fillColor: [42, 53, 33] },
        columnStyles: { 3: { cellWidth: 55 } },
      });

      const finalY1 = doc.lastAutoTable ? doc.lastAutoTable.finalY : 34;
      doc.setFontSize(11);
      doc.text("Resumen general por docente (transparencia en la carga de apoyo)", 14, finalY1 + 10);

      const filasResumen = balance.map((b) => [
        b.nombre,
        String(b.examenes),
        String(b.formativos),
        String(b.sumativos),
        String(b.minutos),
      ]);

      doc.autoTable({
        startY: finalY1 + 14,
        head: [["Docente", "Total exámenes", "Formativos", "Sumativos", "Minutos acumulados"]],
        body: filasResumen,
        styles: { fontSize: 8, cellPadding: 2 },
        headStyles: { fillColor: [163, 118, 60] },
      });

      doc.save("control-apoyo-examenes.pdf");
    } catch (e) {
      setError("No se pudo generar el PDF. Verifique su conexión a internet e intente de nuevo.");
    }
  }

  function formatFechaCorta(fechaISO) {
    const partes = fechaISO.split("-").map(Number);
    const y = partes[0], m = partes[1], d = partes[2];
    const yy = String(y).slice(-2);
    return String(d).padStart(2, "0") + "-" + MESES[m - 1] + "-" + yy;
  }

  function construirMensaje(fecha) {
    const registrosDia = registros.filter((r) => r.fecha === fecha);
    if (registrosDia.length === 0) {
      return "";
    }

    const ciclosPresentes = Array.from(new Set(registrosDia.map((r) => r.ciclo)));
    const cicloTexto =
      ciclosPresentes.length >= 2 ? "con ambos ciclos" : "con el " + ciclosPresentes[0];

    const horas = Array.from(new Set(registrosDia.map((r) => r.hora))).sort();

    const lineas = [];
    lineas.push("*INSTALACIÓN DEL COMITÉ DE EVALUACIONES ECEME.*");
    lineas.push(
      "Buenas tardes mi Cnl., en cumplimiento al horario de actividades de la ECEME., se tiene programado para el día de mañana *" +
        formatFechaCorta(fecha) +
        "* EVALUACIÓN " +
        cicloTexto +
        ", de acuerdo al siguiente detalle:"
    );
    lineas.push("");

    horas.forEach((hora) => {
      lineas.push("*Horas " + hora + "*");
      const registrosHora = registrosDia.filter((r) => r.hora === hora);
      const ordenCiclo = ["1er Ciclo", "2do Ciclo"];
      ordenCiclo.forEach((ciclo) => {
        const registrosGrupo = registrosHora.filter((r) => r.ciclo === ciclo);
        if (registrosGrupo.length === 0) return;

        const esPlural = registrosGrupo.length > 1;
        const tipoGrupo = registrosGrupo[0].tipo;
        const subtitulo = esPlural
          ? "UU.CC. MENCIONES"
          : "U.C. " + registrosGrupo[0].mencionMateria.split(" — ")[1];
        const roles = rolesConfig[ciclo] || ROLES_DEFECTO[ciclo];

        lineas.push(
          tipoGrupo.toUpperCase() + " *" + subtitulo + "* (" + roles + ")."
        );

        const nombresVistos = new Set();
        const nombres = [];
        registrosGrupo.forEach((r) => {
          (r.profesoresMateria || []).forEach((nombre) => {
            if (!nombresVistos.has(nombre)) {
              nombresVistos.add(nombre);
              nombres.push(nombre);
            }
          });
        });

        lineas.push("*Profesores de la" + (esPlural ? "s UU.CC." : " U.C.") + "*");
        nombres.forEach((n) => lineas.push("- " + n));
      });
      lineas.push("");
    });

    lineas.push("*Atentamente.*");
    return lineas.join("\n");
  }

  function generarMensaje() {
    setError("");
    if (!fechaMensaje) {
      setError("Seleccione la fecha del examen para generar el mensaje.");
      return;
    }
    const texto = construirMensaje(fechaMensaje);
    if (!texto) {
      setError("No hay exámenes registrados para esa fecha.");
      return;
    }
    setMensaje(texto);
  }

  async function copiarMensaje() {
    try {
      await navigator.clipboard.writeText(mensaje);
    } catch (e) {
      setError("No se pudo copiar el mensaje. Selecciónelo y cópielo manualmente.");
    }
  }

  function enviarPorWhatsApp() {
    const url = "https://wa.me/?text=" + encodeURIComponent(mensaje);
    window.open(url, "_blank");
  }

  const registrosFiltrados = useMemo(() => {
    if (filtroCiclo === "Todos") return registros;
    return registros.filter((r) => r.ciclo === filtroCiclo);
  }, [registros, filtroCiclo]);

  const balance = useMemo(() => {
    const base = {};
    personal.forEach((p) => {
      base[p.id] = { nombre: p.nombre, formativos: 0, sumativos: 0, minutos: 0, examenes: 0 };
    });
    registrosFiltrados.forEach((r) => {
      r.apoyos.forEach((a) => {
        const pid = a.personaId;
        if (!base[pid]) return;
        base[pid].minutos += r.duracion;
        base[pid].examenes += 1;
        const tipoLower = r.tipo.toLowerCase();
        if (tipoLower.indexOf("formativ") !== -1) base[pid].formativos += 1;
        else if (tipoLower.indexOf("sumativ") !== -1) base[pid].sumativos += 1;
      });
    });
    return Object.values(base).sort((a, b) => b.minutos - a.minutos);
  }, [personal, registrosFiltrados]);

  const maxMinutos = Math.max(1, ...balance.map((b) => b.minutos));

  const inkDark = "#26301f";
  const inkMuted = "#5b5748";
  const parchment = "#f6f3ea";
  const parchmentCard = "#fbf9f2";
  const olive = "#3c4a30";
  const oliveDeep = "#2a3521";
  const brass = "#a3763c";
  const brassLight = "#e9dcc2";
  const borderCol = "#ddd6c2";
  const danger = "#8f3b2e";
  const dangerBg = "#f4e4de";
  const warnBg = "#f4ecd8";
  const warnText = "#6b4b1c";

  if (loading) {
    return (
      <div style={{ padding: "2rem", fontFamily: "Georgia, 'Times New Roman', serif", color: inkMuted, background: parchment, minHeight: "100vh" }}>
        Cargando control de exámenes…
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif", background: parchment, color: inkDark, minHeight: "100vh" }}>
      <div style={{ background: oliveDeep, color: brassLight, padding: "22px 28px", borderBottom: "3px solid " + brass }}>
        <div style={{ fontFamily: "Georgia, 'Times New Roman', serif", fontSize: 22, letterSpacing: 0.3 }}>
          Control de apoyo en exámenes
        </div>
        <div style={{ fontSize: 13, color: "#cfc4a3", marginTop: 4 }}>
          ECEME "Mcal. Andrés de Santa Cruz" · Formativos hasta 120 min · Sumativos más de 300 min
        </div>
      </div>

      <div style={{ maxWidth: 1000, margin: "0 auto", padding: "24px 20px 60px" }}>
        {sinAlmacenPersistente && (
          <div style={{ background: warnBg, color: warnText, border: "1px solid " + brass, borderRadius: 6, padding: "10px 14px", marginBottom: 18, fontSize: 13 }}>
            Este navegador no permite guardar datos de forma persistente, así que los registros no se guardarán al cerrar la página.
          </div>
        )}
        {error && (
          <div style={{ background: dangerBg, color: danger, border: "1px solid " + danger, borderRadius: 6, padding: "10px 14px", marginBottom: 18, fontSize: 14 }}>
            {error}
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
          <section style={{ background: parchmentCard, border: "1px solid " + borderCol, borderRadius: 8, padding: "18px 20px" }}>
            <h2 style={{ fontFamily: "Georgia, serif", fontSize: 16, margin: "0 0 12px", color: olive }}>Personal de apoyo</h2>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              <input
                value={nuevoNombre}
                onChange={(e) => setNuevoNombre(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && agregarPersona()}
                placeholder="Nombre y grado"
                style={{ flex: 1, padding: "8px 10px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 14, background: "#fff" }}
              />
              <button onClick={agregarPersona} style={{ background: olive, color: "#fff", border: "none", borderRadius: 5, padding: "8px 14px", fontSize: 14, cursor: "pointer" }}>
                Añadir
              </button>
            </div>
            {personal.length === 0 ? (
              <div style={{ fontSize: 13, color: inkMuted }}>Todavía no hay personal registrado.</div>
            ) : (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {personal.map((p) => (
                  <span key={p.id} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: brassLight, color: "#5a4321", borderRadius: 20, padding: "4px 6px 4px 12px", fontSize: 13 }}>
                    {p.nombre}
                    <button onClick={() => quitarPersona(p.id)} title="Quitar" style={{ border: "none", background: "transparent", color: "#7a5a2a", cursor: "pointer", fontSize: 14, lineHeight: 1, padding: "2px 4px" }}>
                      ×
                    </button>
                  </span>
                ))}
              </div>
            )}
          </section>

          <section style={{ background: parchmentCard, border: "1px solid " + borderCol, borderRadius: 8, padding: "18px 20px" }}>
            <h2 style={{ fontFamily: "Georgia, serif", fontSize: 16, margin: "0 0 12px", color: olive }}>Registrar examen</h2>
            <form onSubmit={registrarExamen} style={{ display: "grid", gap: 10 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <label style={{ fontSize: 12, color: inkMuted }}>
                  Fecha
                  <input type="date" value={form.fecha} onChange={(e) => setForm((f) => ({ ...f, fecha: e.target.value }))}
                    style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 13 }} />
                </label>
                <label style={{ fontSize: 12, color: inkMuted }}>
                  Hora
                  <input type="time" value={form.hora} onChange={(e) => setForm((f) => ({ ...f, hora: e.target.value }))}
                    style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 13 }} />
                </label>
              </div>

              <label style={{ fontSize: 12, color: inkMuted }}>
                Ciclo
                <select value={form.ciclo} onChange={(e) => setForm((f) => ({ ...f, ciclo: e.target.value, materiaId: "" }))}
                  style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 13 }}>
                  <option>1er Ciclo</option>
                  <option>2do Ciclo</option>
                </select>
              </label>

              <label style={{ fontSize: 12, color: inkMuted }}>
                Materia (orden fijo del programa)
                <select value={form.materiaId} onChange={(e) => setForm((f) => ({ ...f, materiaId: e.target.value }))}
                  style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 13 }}>
                  <option value="">Seleccione una materia…</option>
                  {MATERIAS_ORDEN.filter((m) => m.ciclo === form.ciclo).map((m) => (
                    <option key={m.id} value={m.id}>
                      {m.n}. [{m.track}] {m.materia}
                    </option>
                  ))}
                </select>
              </label>

              {form.materiaId && (
                <div>
                  <div style={{ fontSize: 12, color: inkMuted, marginBottom: 6 }}>Docentes que dictaron esta materia (para el mensaje de WhatsApp)</div>
                  {personal.length === 0 ? (
                    <div style={{ fontSize: 13, color: inkMuted }}>Añada personal en la sección de arriba primero.</div>
                  ) : (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, maxHeight: 140, overflowY: "auto" }}>
                      {personal.map((p) => {
                        const activo = (profesoresPorMateria[form.materiaId] || []).includes(p.id);
                        return (
                          <button type="button" key={p.id} onClick={() => toggleProfesorMateria(form.materiaId, p.id)}
                            style={{ border: "1px solid " + (activo ? "#3b5a25" : borderCol), background: activo ? "#e2ead6" : "#fff", color: activo ? "#2f4a1e" : inkDark, borderRadius: 20, padding: "5px 12px", fontSize: 13, cursor: "pointer" }}>
                            {p.nombre}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              <label style={{ fontSize: 12, color: inkMuted }}>
                Actividad
                <select value={form.tipo} onChange={(e) => onTipoChange(e.target.value)}
                  style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 13 }}>
                  {ACTIVIDADES.map((a) => (
                    <option key={a}>{a}</option>
                  ))}
                </select>
              </label>
              {duracionPorTipo(form.tipo) > 0 && (
                <div style={{ fontSize: 12, color: inkMuted }}>
                  Duración: {duracionPorTipo(form.tipo)} minutos ({form.tipo === "Evaluación formativa" ? "máximo 120 min" : "más de 300 min"})
                </div>
              )}

              <div>
                <div style={{ fontSize: 12, color: inkMuted, marginBottom: 6 }}>Personas de apoyo y paralelo (A, B o C)</div>
                {personal.length === 0 ? (
                  <div style={{ fontSize: 13, color: inkMuted }}>Añada personal arriba primero.</div>
                ) : (
                  <React.Fragment>
                    {form.apoyos.length > 0 && (
                      <div style={{ display: "grid", gap: 6, marginBottom: 8 }}>
                        {form.apoyos.map((a) => {
                          const persona = personal.find((p) => p.id === a.personaId);
                          if (!persona) return null;
                          return (
                            <div key={a.personaId} style={{ display: "flex", alignItems: "center", gap: 8, background: "#fff", border: "1px solid " + borderCol, borderRadius: 6, padding: "5px 8px" }}>
                              <span style={{ flex: 1, fontSize: 13 }}>{persona.nombre}</span>
                              <select value={a.paralelo} onChange={(e) => cambiarParaleloApoyo(a.personaId, e.target.value)}
                                style={{ padding: "4px 6px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 12 }}>
                                <option value="A">Paralelo A</option>
                                <option value="B">Paralelo B</option>
                                <option value="C">Paralelo C</option>
                              </select>
                              <button type="button" onClick={() => toggleApoyo(a.personaId)} title="Quitar"
                                style={{ border: "none", background: "transparent", color: danger, cursor: "pointer", fontSize: 13, padding: "2px 4px" }}>
                                ×
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, maxHeight: 120, overflowY: "auto" }}>
                      {personal.filter((p) => !form.apoyos.some((a) => a.personaId === p.id)).map((p) => (
                        <button type="button" key={p.id} onClick={() => toggleApoyo(p.id)}
                          style={{ border: "1px solid " + borderCol, background: "#fff", color: inkDark, borderRadius: 20, padding: "5px 12px", fontSize: 13, cursor: "pointer" }}>
                          + {p.nombre}
                        </button>
                      ))}
                    </div>
                  </React.Fragment>
                )}
              </div>

              <button type="submit" style={{ marginTop: 4, background: brass, color: "#fff", border: "none", borderRadius: 5, padding: "10px 14px", fontSize: 14, cursor: "pointer" }}>
                Registrar examen
              </button>
            </form>
          </section>
        </div>

        <section style={{ background: parchmentCard, border: "1px solid " + borderCol, borderRadius: 8, padding: "18px 20px", marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h2 style={{ fontFamily: "Georgia, serif", fontSize: 16, margin: 0, color: olive }}>Balance de carga por persona</h2>
            <select value={filtroCiclo} onChange={(e) => setFiltroCiclo(e.target.value)}
              style={{ padding: "6px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 13 }}>
              <option>Todos</option>
              <option>1er Ciclo</option>
              <option>2do Ciclo</option>
            </select>
          </div>
          {balance.length === 0 ? (
            <div style={{ fontSize: 13, color: inkMuted }}>Aún no hay datos para mostrar el balance.</div>
          ) : (
            <div style={{ display: "grid", gap: 10 }}>
              {balance.map((b) => (
                <div key={b.nombre} style={{ display: "grid", gridTemplateColumns: "220px 1fr 130px", alignItems: "center", gap: 10 }}>
                  <div style={{ fontSize: 13 }}>{b.nombre}</div>
                  <div style={{ background: "#ece6d4", borderRadius: 4, height: 14, position: "relative" }}>
                    <div style={{ width: Math.round((b.minutos / maxMinutos) * 100) + "%", background: olive, height: "100%", borderRadius: 4 }} />
                  </div>
                  <div style={{ fontSize: 12, color: inkMuted, textAlign: "right" }}>
                    {b.minutos} min · {b.formativos}F / {b.sumativos}S
                  </div>
                </div>
              ))}
            </div>
          )}
        </section>

        <section style={{ background: parchmentCard, border: "1px solid " + borderCol, borderRadius: 8, padding: "18px 20px", marginBottom: 20 }}>
          <h2 style={{ fontFamily: "Georgia, serif", fontSize: 16, margin: "0 0 12px", color: olive }}>Mensaje para WhatsApp</h2>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
            <label style={{ fontSize: 12, color: inkMuted }}>
              Roles para 1er Ciclo (entre paréntesis)
              <input value={rolesConfig["1er Ciclo"]} onChange={(e) => guardarRolesConfig({ ...rolesConfig, "1er Ciclo": e.target.value })}
                style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 12 }} />
            </label>
            <label style={{ fontSize: 12, color: inkMuted }}>
              Roles para 2do Ciclo (entre paréntesis)
              <input value={rolesConfig["2do Ciclo"]} onChange={(e) => guardarRolesConfig({ ...rolesConfig, "2do Ciclo": e.target.value })}
                style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 12 }} />
            </label>
          </div>

          <div style={{ display: "flex", gap: 8, alignItems: "flex-end", marginBottom: 12, flexWrap: "wrap" }}>
            <label style={{ fontSize: 12, color: inkMuted }}>
              Fecha del examen
              <select value={fechaMensaje} onChange={(e) => setFechaMensaje(e.target.value)}
                style={{ display: "block", marginTop: 4, padding: "7px 8px", border: "1px solid " + borderCol, borderRadius: 5, fontSize: 13, minWidth: 160 }}>
                <option value="">Seleccione…</option>
                {Array.from(new Set(registros.map((r) => r.fecha))).sort().map((f) => (
                  <option key={f} value={f}>{f}</option>
                ))}
              </select>
            </label>
            <button onClick={generarMensaje} disabled={registros.length === 0}
              style={{ background: registros.length === 0 ? "#c9c2ac" : brass, color: "#fff", border: "none", borderRadius: 5, padding: "9px 14px", fontSize: 13, cursor: registros.length === 0 ? "default" : "pointer" }}>
              Generar mensaje
            </button>
          </div>

          {mensaje && (
            <div>
              <textarea value={mensaje} onChange={(e) => setMensaje(e.target.value)} rows={14}
                style={{ width: "100%", boxSizing: "border-box", padding: 10, border: "1px solid " + borderCol, borderRadius: 6, fontSize: 13, fontFamily: "inherit", marginBottom: 10 }} />
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button onClick={copiarMensaje} style={{ background: olive, color: "#fff", border: "none", borderRadius: 5, padding: "8px 14px", fontSize: 13, cursor: "pointer" }}>
                  Copiar mensaje
                </button>
                <button onClick={enviarPorWhatsApp} style={{ background: "#3fa15e", color: "#fff", border: "none", borderRadius: 5, padding: "8px 14px", fontSize: 13, cursor: "pointer" }}>
                  Enviar por WhatsApp
                </button>
              </div>
            </div>
          )}
        </section>

        <section style={{ background: parchmentCard, border: "1px solid " + borderCol, borderRadius: 8, padding: "18px 20px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h2 style={{ fontFamily: "Georgia, serif", fontSize: 16, margin: 0, color: olive }}>Registros de exámenes</h2>
            <button onClick={generarPDF} disabled={registros.length === 0}
              style={{ background: registros.length === 0 ? "#c9c2ac" : olive, color: "#fff", border: "none", borderRadius: 5, padding: "8px 14px", fontSize: 13, cursor: registros.length === 0 ? "default" : "pointer" }}>
              Generar reporte PDF
            </button>
          </div>
          {registrosFiltrados.length === 0 ? (
            <div style={{ fontSize: 13, color: inkMuted }}>No hay registros para el ciclo seleccionado.</div>
          ) : (
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ textAlign: "left", borderBottom: "2px solid " + borderCol, color: inkMuted }}>
                    <th style={{ padding: "6px 8px" }}>Fecha</th>
                    <th style={{ padding: "6px 8px" }}>Hora</th>
                    <th style={{ padding: "6px 8px" }}>Ciclo</th>
                    <th style={{ padding: "6px 8px" }}>Tipo</th>
                    <th style={{ padding: "6px 8px" }}>Mención / materia</th>
                    <th style={{ padding: "6px 8px" }}>Docentes (materia)</th>
                    <th style={{ padding: "6px 8px" }}>Apoyo</th>
                    <th style={{ padding: "6px 8px" }}></th>
                  </tr>
                </thead>
                <tbody>
                  {registrosFiltrados.map((r) => (
                    <tr key={r.id} style={{ borderBottom: "1px solid " + borderCol }}>
                      <td style={{ padding: "6px 8px" }}>{r.fecha}</td>
                      <td style={{ padding: "6px 8px" }}>{r.hora || "—"}</td>
                      <td style={{ padding: "6px 8px" }}>{r.ciclo}</td>
                      <td style={{ padding: "6px 8px" }}>
                        <span style={{ background: r.tipo.toLowerCase().indexOf("sumativ") !== -1 ? brassLight : "#e2ead6", color: r.tipo.toLowerCase().indexOf("sumativ") !== -1 ? "#6b4b1c" : "#3b5a25", borderRadius: 4, padding: "2px 8px", fontSize: 12 }}>
                          {r.tipo}
                        </span>
                      </td>
                      <td style={{ padding: "6px 8px" }}>{r.mencionMateria}</td>
                      <td style={{ padding: "6px 8px" }}>{(r.profesoresMateria || []).join(", ") || "—"}</td>
                      <td style={{ padding: "6px 8px" }}>
                        {r.apoyos.map((a) => {
                          const persona = personal.find((p) => p.id === a.personaId);
                          return (persona ? persona.nombre : "—") + " (Par. " + a.paralelo + ")";
                        }).join(", ")}
                      </td>
                      <td style={{ padding: "6px 8px", textAlign: "right" }}>
                        <button onClick={() => eliminarRegistro(r.id)} style={{ border: "none", background: "transparent", color: danger, cursor: "pointer", fontSize: 12 }}>
                          Eliminar
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ControlExamenes />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
